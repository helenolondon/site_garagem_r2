<section id="servicos" class="py-24 px-6">
  <div class="max-w-6xl mx-auto">
    <div class="max-w-2xl mb-16">
      <span class="text-xs uppercase tracking-widest text-primary">Nossos serviços</span>
      <h2 class="mt-3 text-4xl md:text-5xl font-bold tracking-tight">
        Cuidado completo para o seu carro
      </h2>
      <p class="mt-4 text-muted-foreground">
        Cada serviço é executado com produtos profissionais e protocolos rigorosos. Você acompanha cada etapa.
      </p>
    </div>
    <div class="grid md:grid-cols-2 gap-6">
      <div *ngFor="let service of services" class="group relative overflow-hidden rounded-xl border border-border bg-card">
        <div class="aspect-[16/10] overflow-hidden">
          <img
            [src]="service.img"
            [alt]="service.title"
            loading="lazy"
            class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105"
          />
        </div>
        <div class="p-6">
          <div class="flex items-center gap-3">
            <div class="rounded-md bg-primary/10 p-2 text-2xl">
              {{ service.icon }}
            </div>
            <h3 class="text-xl font-semibold">{{ service.title }}</h3>
          </div>
          <p class="mt-3 text-sm text-muted-foreground">{{ service.desc }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
