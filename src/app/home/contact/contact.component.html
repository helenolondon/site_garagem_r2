<section id="contato" class="py-24 px-6 bg-card/40 border-t border-border">
  <div class="max-w-6xl mx-auto grid md:grid-cols-2 gap-12">
    <div>
      <span class="text-xs uppercase tracking-widest text-primary">Contato</span>
      <h2 class="mt-3 text-4xl md:text-5xl font-bold tracking-tight">Agende seu horário</h2>
      <p class="mt-4 text-muted-foreground">
        Fale com a gente pelo WhatsApp e receba um orçamento personalizado em minutos.
      </p>
      <button
        (click)="agendarWhatsApp()"
        class="mt-8 inline-flex items-center gap-2 rounded-md bg-primary px-6 py-3 text-sm font-semibold text-primary-foreground hover:opacity-90 transition"
        style="box-shadow: var(--shadow-glow)"
      >
        📞 Chamar no WhatsApp
      </button>
    </div>
    <div class="space-y-5">
      <div *ngFor="let item of contactItems" class="flex items-start gap-4 rounded-lg border border-border bg-card p-5">
        <div class="rounded-md bg-primary/10 p-2 text-2xl">
          {{ item.icon }}
        </div>
        <div>
          <div class="text-sm font-semibold">{{ item.title }}</div>
          <div class="text-sm text-muted-foreground mt-1">{{ item.text }}</div>
        </div>
      </div>
    </div>
  </div>
</section>
