<section id="precos" class="py-24 px-6">
  <div class="max-w-6xl mx-auto">
    <div class="max-w-2xl mb-16">
      <span class="text-xs uppercase tracking-widest text-primary">Preços</span>
      <h2 class="mt-3 text-4xl md:text-5xl font-bold tracking-tight">Pacotes simples e transparentes</h2>
    </div>
    <div class="grid md:grid-cols-3 gap-6">
      <div
        *ngFor="let plan of plans"
        [class]="'rounded-xl border p-8 flex flex-col ' + (plan.featured ? 'border-primary bg-card relative' : 'border-border bg-card/60')"
        [style.box-shadow]="plan.featured ? 'var(--shadow-glow)' : ''"
      >
        <span *ngIf="plan.featured" class="absolute -top-3 left-8 rounded-full bg-primary px-3 py-1 text-xs font-semibold text-primary-foreground">
          Mais pedido
        </span>
        <h3 class="text-xl font-semibold">{{ plan.name }}</h3>
        <div class="mt-4 flex items-baseline gap-1">
          <span class="text-4xl font-bold">{{ plan.price }}</span>
          <span class="text-sm text-muted-foreground">/ a partir de</span>
        </div>
        <ul class="mt-6 space-y-3 flex-1">
          <li *ngFor="let item of plan.items" class="flex gap-2 text-sm text-muted-foreground">
            <span class="text-primary flex-shrink-0 mt-0.5">✓</span> {{ item }}
          </li>
        </ul>
        <a
          [href]="whatsappUrl"
          target="_blank"
          rel="noreferrer"
          [class]="'mt-8 inline-flex items-center justify-center rounded-md px-4 py-2.5 text-sm font-medium transition ' + (plan.featured ? 'bg-primary text-primary-foreground hover:opacity-90' : 'border border-border hover:bg-secondary')"
        >
          Agendar
        </a>
      </div>
    </div>
  </div>
</section>
